<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Convertidor en tiempo real a studs</title>
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #06b6d4;
      --muted: #94a3b8;
      --text: #e6eef6
    }

    * {
      box-sizing: border-box;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07142A;
      color: var(--text)
    }

    .container {
      width: 100%;
      max-width: 720px;
      padding: 28px
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 6px 28px rgba(0, 0, 0, .55);
      border: 1px solid rgba(255, 255, 255, .04)
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 20px;
      font-weight: 600
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .input,
    .select {
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .05);
      background: #071325;
      color: var(--text)
    }

    .input {
      width: 170px
    }

    .select {
      width: 140px
    }

    .result {
      padding: 14px;
      border-radius: 8px;
      background: #06121a;
      border: 1px solid rgba(255, 255, 255, .04);
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .value {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 17px
    }

    .copy-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .07);
      padding: 8px 11px;
      border-radius: 8px;
      color: var(--text);
      cursor: pointer
    }

    .copy-btn:active {
      transform: translateY(1px)
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Convertidor a studs</h1>

      <div class="row">
        <input id="value" class="input" placeholder="Valor (ej: 1.8 o 180)" />
        <select id="unit" class="select">
          <option value="m">Metros (m)</option>
          <option value="cm">Centímetros (cm)</option>
        </select>
      </div>

      <div class="result">
        <div>
          <div style="font-size:12px;color:var(--muted)">Studs</div>
          <div id="studsValue" class="value">0</div>
        </div>
        <button id="copyBtn" class="copy-btn">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const convPerMeter = 1 / 0.28;
      const valueEl = document.getElementById("value");
      const unitEl = document.getElementById("unit");
      const studsEl = document.getElementById("studsValue");
      const copyBtn = document.getElementById("copyBtn");

      function sanitize(v) {
        if (!v) return "";
        v = v.replace(/,/g, ".").replace(/\s+/g, "");
        const parts = v.split(".");
        if (parts.length > 2) {
          v = parts[0] + "." + parts.slice(1).join("");
        }
        if (v.startsWith(".")) v = "0" + v;
        return v;
      }

      function update() {
        let raw = sanitize(valueEl.value);
        if (raw === "" || isNaN(Number(raw))) {
          studsEl.textContent = "0";
          return;
        }
        let num = Number(raw);
        let meters = unitEl.value === "cm" ? num / 100 : num;
        let studs = meters * convPerMeter;
        let out = studs.toFixed(6).replace(/\.?0+$/, "");
        studsEl.textContent = out;
      }

      valueEl.addEventListener("input", update);
      unitEl.addEventListener("change", update);

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(studsEl.textContent).then(() => {
          copyBtn.textContent = "Copiado";
          setTimeout(() => copyBtn.textContent = "Copiar", 900);
        });
      });

      update();
    })();
  </script>
</body>

</html>
